<main id="main">
  <header class="glossary-head">
    <h1>中英術語表</h1>
    <p>這張表沒有手動維護：它讀取每份講義最後的「中英術語」表格，自動合併在一起。考前用英文關鍵字搜尋，可以快速對回中文觀念和出處。</p>

  <div class="filters">
    <label for="q" class="visually-hidden">搜尋術語</label>
    <input id="q" type="search" placeholder="輸入中文或英文，例如 divergence、阻尼" autocomplete="off">
    <label for="course">課程</label>
    <select id="course"><option value="">全部課程</option></select>
  </div>
  <p class="term-count" id="count" aria-live="polite">讀取講義中……</p>
  <div class="table-wrap">
    <table class="terms" id="glossary-table">
      <thead><tr><th>中文</th><th>English</th><th>符號／備註</th><th>出處</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<footer class="site-foot">
  術語表由各講義的 <code>#terms</code> 表格產生。新增講義時照 CLAUDE.md 的格式寫術語表，這裡就會自動出現。
